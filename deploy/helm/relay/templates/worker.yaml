{{- $flavor := .Values.worker.flavor -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels: {{- include "relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: relay-worker, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- if eq $flavor "llamacpp" }}
      volumes:
        - name: models
          emptyDir: {}
      initContainers:
        - name: model-download
          image: curlimages/curl:8.11.1
          command: ["sh", "-c", "curl -fL --retry 5 -o /models/{{ .Values.worker.llamacpp.modelFile }} {{ .Values.worker.llamacpp.modelUrl }}"]
          volumeMounts: [{name: models, mountPath: /models}]
      {{- else if eq $flavor "vllm" }}
      runtimeClassName: nvidia
      volumes:
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
        - name: hf-cache
          hostPath: {path: /var/lib/hf-cache, type: DirectoryOrCreate}
      {{- end }}
      containers:
        - name: model
          {{- if eq $flavor "llamacpp" }}
          image: {{ .Values.worker.llamacpp.image }}
          args: ["-m", "/models/{{ .Values.worker.llamacpp.modelFile }}", "--host", "0.0.0.0", "--port", "8080", "--metrics",
                 {{- range .Values.worker.llamacpp.args }} {{ . | quote }},{{ end }} "--alias", {{ .Values.worker.model | quote }}]
          volumeMounts: [{name: models, mountPath: /models}]
          resources: {{- toYaml .Values.worker.llamacpp.resources | nindent 12 }}
          {{- else if eq $flavor "vllm" }}
          image: {{ .Values.worker.vllm.image }}
          args: ["--model", {{ .Values.worker.vllm.model | quote }}, "--port", "8080",
                 "--enable-prefix-caching", "--enable-prompt-tokens-details",
                 "--gpu-memory-utilization", {{ .Values.worker.vllm.gpuMemoryUtilization | quote }},
                 "--max-model-len", {{ .Values.worker.vllm.maxModelLen | quote }}]
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: hf-cache, mountPath: /root/.cache/huggingface}
          resources:
            requests: {{- toYaml .Values.worker.vllm.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.worker.vllm.resources.limits | nindent 14 }}
              nvidia.com/gpu: {{ .Values.worker.vllm.gpusPerWorker }}
          {{- else }}
          image: {{ include "relay.image" (dict "root" . "name" "simworker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-addr", ":8080", {{- range .Values.worker.sim.args }} {{ . | quote }},{{ end }} "-model", "sim"]
          resources: {{- toYaml .Values.worker.sim.resources | nindent 12 }}
          {{- end }}
          ports: [{name: http, containerPort: 8080}]
          # Startup can take minutes (model download / load); readiness gates
          # membership because the headless Service only lists ready pods.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # Graceful drain: before the model server gets SIGTERM, ask the
            # sidecar to announce "draining" (routers stop sending new work)
            # and block until in-flight streams finish (or the grace period).
            preStop:
              exec:
                # curl exists in the llama.cpp and Relay images; the vLLM image has python3.
                command: ["sh", "-c", "curl -fsS -m {{ .Values.worker.drainGraceSeconds }} -X POST http://127.0.0.1:9501/drain || python3 -c \"import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:9501/drain', method='POST'), timeout={{ .Values.worker.drainGraceSeconds }})\" || sleep 5"]
        - name: sidecar
          image: {{ include "relay.image" (dict "root" . "name" "sidecar") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: grpc, containerPort: 9500}
            - {name: admin, containerPort: 9501}
          env:
            - name: WORKER_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: MODEL_URL
              value: http://127.0.0.1:8080
            - name: WORKER_FLAVOR
              value: {{ if eq $flavor "vllm" }}vllm{{ else }}llamacpp{{ end }}
            - name: SIDECAR_SCRAPE_MS
              value: {{ .Values.worker.sidecar.scrapeMs | quote }}
            - name: DRAIN_GRACE_S
              value: {{ .Values.worker.drainGraceSeconds | quote }}
          lifecycle:
            # The sidecar must outlive the model server's drain.
            preStop:
              exec:
                command: ["sh", "-c", "curl -fsS -m {{ .Values.worker.drainGraceSeconds }} -X POST http://127.0.0.1:9501/drain || true"]
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
          resources: {{- toYaml .Values.worker.sidecar.resources | nindent 12 }}
---
# Headless Service: routers resolve it to the IPs of READY worker pods.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker-headless
  labels: {{- include "relay.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: relay-worker, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: http, port: 8080}
    - {name: grpc, port: 9500}
